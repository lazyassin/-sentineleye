<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 860" width="980" height="860" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b78"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9302c"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d9e75"/>
    </marker>
  </defs>

  <rect width="980" height="860" fill="#ffffff"/>

  <text x="490" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#16324f">SentinelEye — System Architecture</text>
  <text x="490" y="54" text-anchor="middle" font-size="12.5" fill="#6b7280">React client · Supabase PostgreSQL with row-level security · Deno edge functions · Resend</text>

  <!-- ============ CLIENT LAYER ============ -->
  <rect x="30" y="76" width="920" height="118" rx="10" fill="#f6f8f7" stroke="#cfd8d3" stroke-width="1.5"/>
  <text x="46" y="97" font-size="12.5" font-weight="700" fill="#16324f">CLIENT — React single-page application, deployed on Vercel</text>

  <rect x="46" y="108" width="270" height="72" rx="7" fill="#ffffff" stroke="#cfd8d3"/>
  <text x="60" y="127" font-size="12" font-weight="700" fill="#1d9e75">Admin views</text>
  <text x="60" y="145" font-size="11" fill="#374151">Overview · Phishing campaigns</text>
  <text x="60" y="161" font-size="11" fill="#374151">Roster · Employee drill-down</text>
  <text x="60" y="174" font-size="10" fill="#9ca3af">requires role = admin</text>

  <rect x="330" y="108" width="270" height="72" rx="7" fill="#ffffff" stroke="#cfd8d3"/>
  <text x="344" y="127" font-size="12" font-weight="700" fill="#1d9e75">Employee views</text>
  <text x="344" y="145" font-size="11" fill="#374151">My Training · own risk score</text>
  <text x="344" y="161" font-size="11" fill="#374151">My Phishing · report suspicious</text>
  <text x="344" y="174" font-size="10" fill="#9ca3af">sees only own records</text>

  <rect x="614" y="108" width="320" height="72" rx="7" fill="#fdf6ec" stroke="#e8cfa0"/>
  <text x="628" y="127" font-size="12" font-weight="700" fill="#b8860b">Public reveal routes</text>
  <text x="628" y="145" font-size="11" fill="#374151">/phishing-caught · /phishing-invalid</text>
  <text x="628" y="161" font-size="11" fill="#374151">Non-punitive debrief, no form fields</text>
  <text x="628" y="174" font-size="10" fill="#9ca3af">no session required — recipient has none</text>

  <!-- client -> auth -->
  <line x1="180" y1="194" x2="180" y2="226" stroke="#5b6b78" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="190" y="215" font-size="10.5" fill="#6b7280">supabase-js, authenticated JWT</text>

  <!-- ============ AUTH ============ -->
  <rect x="30" y="228" width="570" height="52" rx="9" fill="#eef4f1" stroke="#bcd2c8" stroke-width="1.5"/>
  <text x="46" y="250" font-size="12.5" font-weight="700" fill="#16324f">SUPABASE AUTH</text>
  <text x="46" y="268" font-size="11" fill="#374151">Email/password · roster-gated sign-up · forced first-login password change · self-service reset</text>

  <line x1="180" y1="280" x2="180" y2="312" stroke="#5b6b78" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ DATABASE ============ -->
  <rect x="30" y="314" width="570" height="228" rx="10" fill="#f6f8f7" stroke="#1d9e75" stroke-width="2"/>
  <text x="46" y="336" font-size="12.5" font-weight="700" fill="#16324f">POSTGRESQL — row-level security is the access boundary</text>
  <text x="46" y="353" font-size="10.5" fill="#6b7280">The database refuses cross-employee reads itself, rather than trusting application code</text>

  <rect x="46" y="364" width="256" height="86" rx="7" fill="#ffffff" stroke="#cfd8d3"/>
  <text x="58" y="382" font-size="11.5" font-weight="700" fill="#1d9e75">Tables</text>
  <text x="58" y="399" font-size="10.5" fill="#374151">employees · profiles</text>
  <text x="58" y="414" font-size="10.5" fill="#374151">training_modules · _completions</text>
  <text x="58" y="429" font-size="10.5" fill="#374151">training_assignments</text>
  <text x="58" y="444" font-size="10.5" fill="#374151">phishing_campaigns · _events</text>

  <rect x="316" y="364" width="268" height="86" rx="7" fill="#ffffff" stroke="#cfd8d3"/>
  <text x="328" y="382" font-size="11.5" font-weight="700" fill="#1d9e75">SECURITY DEFINER functions</text>
  <text x="328" y="399" font-size="10.5" fill="#374151">is_admin · current_employee_id</text>
  <text x="328" y="414" font-size="10.5" fill="#374151">get_my / _employee / _all risk</text>
  <text x="328" y="429" font-size="10.5" fill="#374151">get_department_risk</text>
  <text x="328" y="444" font-size="10.5" fill="#374151">report_phishing_event / _by_token</text>

  <rect x="46" y="462" width="538" height="62" rx="7" fill="#eef4f1" stroke="#bcd2c8"/>
  <text x="58" y="480" font-size="11.5" font-weight="700" fill="#16324f">Risk score — one formula, computed live</text>
  <text x="58" y="498" font-size="11" fill="#374151">100 × ( 0.4 × missed training + 0.6 × phishing risk )</text>
  <text x="58" y="514" font-size="10.5" fill="#6b7280">A clicked simulation that is later reported counts at half weight</text>

  <!-- ============ EDGE FUNCTIONS ============ -->
  <rect x="30" y="576" width="570" height="164" rx="10" fill="#f6f8f7" stroke="#cfd8d3" stroke-width="1.5"/>
  <text x="46" y="598" font-size="12.5" font-weight="700" fill="#16324f">DENO EDGE FUNCTIONS — server-side only</text>
  <text x="46" y="615" font-size="10.5" fill="#6b7280">Hold the service-role key, which never reaches the browser</text>

  <rect x="46" y="626" width="256" height="42" rx="6" fill="#ffffff" stroke="#cfd8d3"/>
  <text x="58" y="643" font-size="11" font-weight="700" fill="#374151">provision-employee</text>
  <text x="58" y="659" font-size="10" fill="#9ca3af">creates account + temp password</text>

  <rect x="46" y="676" width="256" height="46" rx="6" fill="#ffffff" stroke="#cfd8d3"/>
  <text x="58" y="693" font-size="11" font-weight="700" fill="#374151">send-phishing-email</text>
  <text x="58" y="708" font-size="10" fill="#9ca3af">one campaign, N recipients,</text>
  <text x="58" y="719" font-size="10" fill="#9ca3af">unique tracking token each</text>

  <rect x="316" y="626" width="268" height="96" rx="6" fill="#fdf0ef" stroke="#e5b6b3"/>
  <text x="328" y="643" font-size="11" font-weight="700" fill="#c9302c">track-phishing-click</text>
  <text x="328" y="659" font-size="10" fill="#6b7280">public — verify_jwt disabled, the</text>
  <text x="328" y="670" font-size="10" fill="#6b7280">token is the access boundary</text>
  <text x="328" y="687" font-size="10" fill="#374151">1. records first click (idempotent)</text>
  <text x="328" y="700" font-size="10" fill="#374151">2. assigns remediation module</text>
  <text x="328" y="713" font-size="10" fill="#374151">3. redirects to reveal page</text>

  <!-- edge -> db (service role) -->
  <line x1="620" y1="660" x2="620" y2="430" stroke="#5b6b78" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="600" y1="660" x2="620" y2="660" stroke="#5b6b78" stroke-width="1.6"/>
  <line x1="620" y1="430" x2="600" y2="430" stroke="#5b6b78" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="628" y="546" font-size="10.5" fill="#6b7280">service role</text>
  <text x="628" y="560" font-size="10.5" fill="#6b7280">bypasses RLS</text>

  <!-- client invokes edge functions -->
  <path d="M 46 150 L 16 150 L 16 648 L 44 648" fill="none" stroke="#5b6b78" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="22" y="400" font-size="10.5" fill="#6b7280" transform="rotate(-90 22 400)">admin invokes (JWT forwarded, is_admin checked)</text>

  <!-- ============ EMAIL PATH ============ -->
  <rect x="660" y="576" width="290" height="70" rx="9" fill="#ffffff" stroke="#cfd8d3" stroke-width="1.5"/>
  <text x="676" y="598" font-size="12" font-weight="700" fill="#16324f">RESEND</text>
  <text x="676" y="616" font-size="10.5" fill="#374151">Transactional email delivery</text>
  <text x="676" y="632" font-size="10" fill="#9ca3af">per-template sender identity</text>

  <rect x="660" y="668" width="290" height="72" rx="9" fill="#ffffff" stroke="#cfd8d3" stroke-width="1.5"/>
  <text x="676" y="690" font-size="12" font-weight="700" fill="#16324f">RECIPIENT MAILBOX</text>
  <text x="676" y="708" font-size="10.5" fill="#374151">Simulated lure — invoice, credential</text>
  <text x="676" y="723" font-size="10.5" fill="#374151">harvest, or business email compromise</text>

  <!-- send -> resend -->
  <line x1="302" y1="698" x2="656" y2="608" stroke="#1d9e75" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="420" y="668" font-size="10.5" fill="#1d9e75">sends</text>

  <!-- resend -> mailbox -->
  <line x1="805" y1="646" x2="805" y2="664" stroke="#5b6b78" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- mailbox -> track click -->
  <path d="M 660 704 L 600 704" fill="none" stroke="#c9302c" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <text x="596" y="756" font-size="10.5" fill="#c9302c" text-anchor="end">recipient clicks tracked link</text>

  <!-- track click -> public reveal (302) -->
  <path d="M 584 636 L 958 636 L 958 152 L 938 152" fill="none" stroke="#c9302c" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrowRed)"/>
  <text x="948" y="400" font-size="10.5" fill="#c9302c" text-anchor="middle" transform="rotate(-90 948 400)">302 redirect to debrief page</text>

  <!-- ============ LEGEND ============ -->
  <rect x="30" y="770" width="920" height="66" rx="9" fill="#fafbfa" stroke="#e3e8e5"/>
  <text x="46" y="790" font-size="11" font-weight="700" fill="#16324f">Two paths through the system</text>
  <text x="46" y="808" font-size="10.5" fill="#374151">
    <tspan fill="#1d9e75" font-weight="700">Authenticated —</tspan> admin and employee sessions reach the database directly; row-level security scopes every query to what that role may see.
  </text>
  <text x="46" y="825" font-size="10.5" fill="#374151">
    <tspan fill="#c9302c" font-weight="700">Unauthenticated —</tspan> the email recipient has no session, so the tracking token alone authorises the click, and the debrief page is public.
  </text>
</svg>
