<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 590" width="1020" height="590" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b78"/>
    </marker>
    <marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d9e75"/>
    </marker>
    <marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/>
    </marker>
  </defs>

  <rect width="1020" height="590" fill="#ffffff"/>

  <text x="510" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#16324f">From measurement to remediation — what one click sets in motion</text>
  <text x="510" y="50" text-anchor="middle" font-size="12" fill="#6b7280">The loop existing tools leave open: a simulator records the click, a training platform delivers the module, and nothing connects them</text>

  <!-- ============ pipeline ============ -->
  <!-- 1 SIMULATE -->
  <rect x="40" y="86" width="212" height="132" rx="9" fill="#ffffff" stroke="#c9d3da" stroke-width="1.6"/>
  <circle cx="66" cy="112" r="12" fill="#16324f"/>
  <text x="66" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="86" y="117" font-size="13" font-weight="700" fill="#16324f">Simulate</text>
  <text x="54" y="142" font-size="10.5" fill="#374151">Admin targets one employee, a</text>
  <text x="54" y="158" font-size="10.5" fill="#374151">department, or the organisation.</text>
  <text x="54" y="178" font-size="10.5" fill="#6b7280">One campaign row, one event per</text>
  <text x="54" y="194" font-size="10.5" fill="#6b7280">recipient, each with a random</text>
  <text x="54" y="210" font-size="10.5" fill="#6b7280">non-enumerable token.</text>

  <!-- 2 CLICK -->
  <rect x="284" y="86" width="212" height="132" rx="9" fill="#ffffff" stroke="#c9d3da" stroke-width="1.6"/>
  <circle cx="310" cy="112" r="12" fill="#16324f"/>
  <text x="310" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="330" y="117" font-size="13" font-weight="700" fill="#16324f">Click</text>
  <text x="298" y="142" font-size="10.5" fill="#374151">Recipient follows the tracked</text>
  <text x="298" y="158" font-size="10.5" fill="#374151">link in the lure.</text>
  <text x="298" y="178" font-size="10.5" fill="#c9302c">A mail-gateway scanner reaches</text>
  <text x="298" y="194" font-size="10.5" fill="#c9302c">it first in many organisations —</text>
  <text x="298" y="210" font-size="10.5" fill="#c9302c">unresolved, see 6.3.4.</text>

  <!-- 3 RECORD -->
  <rect x="528" y="86" width="212" height="132" rx="9" fill="#ffffff" stroke="#c9d3da" stroke-width="1.6"/>
  <circle cx="554" cy="112" r="12" fill="#16324f"/>
  <text x="554" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="574" y="117" font-size="13" font-weight="700" fill="#16324f">Record, once</text>
  <text x="542" y="142" font-size="10.5" fill="#374151">Write fires only on the</text>
  <text x="542" y="158" font-size="10.5" fill="#374151">not-clicked → clicked transition.</text>
  <text x="542" y="178" font-size="10.5" fill="#6b7280">A re-open or a second scan</text>
  <text x="542" y="194" font-size="10.5" fill="#6b7280">cannot move the recorded</text>
  <text x="542" y="210" font-size="10.5" fill="#6b7280">first-click time.</text>

  <!-- 4 REMEDIATE -->
  <rect x="772" y="86" width="212" height="132" rx="9" fill="#ffffff" stroke="#1d9e75" stroke-width="2.4"/>
  <circle cx="798" cy="112" r="12" fill="#1d9e75"/>
  <text x="798" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="818" y="117" font-size="13" font-weight="700" fill="#1d9e75">Remediate</text>
  <text x="786" y="142" font-size="10.5" fill="#374151">The lure's template maps to the</text>
  <text x="786" y="158" font-size="10.5" fill="#374151">module that addresses it.</text>
  <text x="786" y="178" font-size="10.5" fill="#6b7280">Assignment records the reason</text>
  <text x="786" y="194" font-size="10.5" fill="#6b7280">and the event that caused it.</text>
  <text x="786" y="210" font-size="10.5" fill="#6b7280">Clicking twice assigns once.</text>

  <path d="M 252 152 L 284 152" stroke="#5b6b78" stroke-width="1.8" fill="none" marker-end="url(#m)"/>
  <path d="M 496 152 L 528 152" stroke="#5b6b78" stroke-width="1.8" fill="none" marker-end="url(#m)"/>
  <path d="M 740 152 L 772 152" stroke="#1d9e75" stroke-width="2.2" fill="none" marker-end="url(#mGreen)"/>

  <!-- ============ second row ============ -->
  <!-- DEBRIEF -->
  <rect x="440" y="272" width="240" height="94" rx="9" fill="#fffdf6" stroke="#e8cfa0" stroke-width="1.8"/>
  <text x="560" y="296" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b8860b">Debrief, served immediately</text>
  <text x="454" y="317" font-size="10.5" fill="#374151">Names the influence principle the</text>
  <text x="454" y="333" font-size="10.5" fill="#374151">message used. No score, no comparison,</text>
  <text x="454" y="349" font-size="10.5" fill="#374151">no form to type a password into.</text>
  <text x="454" y="362" font-size="9.5" fill="#9ca3af">Coping information, not threat alone (Rogers, 1975)</text>

  <!-- TRAINING LIST -->
  <rect x="772" y="272" width="212" height="94" rx="9" fill="#ffffff" stroke="#c9d3da" stroke-width="1.6"/>
  <text x="878" y="296" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16324f">Priority on the list</text>
  <text x="786" y="317" font-size="10.5" fill="#374151">Module appears badged, with</text>
  <text x="786" y="333" font-size="10.5" fill="#374151">the reason shown to the</text>
  <text x="786" y="349" font-size="10.5" fill="#374151">employee, then completed.</text>

  <!-- REPORT -->
  <rect x="150" y="272" width="212" height="94" rx="9" fill="#f4faf7" stroke="#1d9e75" stroke-width="1.8"/>
  <text x="256" y="296" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d9e75">Report it</text>
  <text x="164" y="317" font-size="10.5" fill="#374151">From the employee's own list, or</text>
  <text x="164" y="333" font-size="10.5" fill="#374151">by pasting the suspicious link.</text>
  <text x="164" y="349" font-size="10.5" fill="#374151">A reported click counts half.</text>
  <text x="164" y="362" font-size="9.5" fill="#9ca3af">Human as sensor (Zimmermann and Renaud, 2019)</text>

  <path d="M 600 218 L 578 272" stroke="#b8860b" stroke-width="1.8" fill="none" marker-end="url(#mAmber)"/>
  <path d="M 878 218 L 878 272" stroke="#1d9e75" stroke-width="2.2" fill="none" marker-end="url(#mGreen)"/>
  <path d="M 440 319 L 362 319" stroke="#1d9e75" stroke-width="1.8" fill="none" marker-end="url(#mGreen)"/>
  <text x="401" y="311" text-anchor="middle" font-size="9.5" fill="#6b7280">still can</text>

  <!-- ============ score ============ -->
  <rect x="350" y="430" width="320" height="86" rx="9" fill="#ffffff" stroke="#16324f" stroke-width="2.4"/>
  <text x="510" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">Risk score, recomputed on demand</text>
  <text x="510" y="475" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#374151">100 × (0.4 × missed training + 0.6 × click rate)</text>
  <text x="510" y="493" text-anchor="middle" font-size="10.5" fill="#6b7280">Never stored, so it cannot drift from the records it describes.</text>
  <text x="510" y="508" text-anchor="middle" font-size="10" fill="#9ca3af">The system computes and reports; it never acts on the number itself.</text>

  <path d="M 256 366 C 256 430 300 452 350 461" stroke="#5b6b78" stroke-width="1.6" fill="none" marker-end="url(#m)"/>
  <path d="M 878 366 C 878 430 760 452 670 461" stroke="#5b6b78" stroke-width="1.6" fill="none" marker-end="url(#m)"/>

  <!-- feedback loop -->
  <path d="M 350 500 C 120 512 40 420 40 260" stroke="#9ca3af" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#m)"/>
  <text x="96" y="424" font-size="10" fill="#9ca3af" transform="rotate(-90 96 424)">informs the next campaign</text>

  <text x="510" y="556" text-anchor="middle" font-size="11.5" fill="#374151">Stages 3 and 4 are one function and one transaction path: the record and the remedy cannot disagree, because the same click writes both.</text>
  <text x="510" y="575" text-anchor="middle" font-size="10" fill="#9ca3af">Green marks the measurement-to-remediation join; amber marks the disclosure the ethical argument rests on.</text>
</svg>
